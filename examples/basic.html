<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickAuth Web SDK — basic example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #111;
      }
      h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
      label { display: block; margin: 1rem 0 0.4rem; font-weight: 600; }
      input, button {
        width: 100%;
        padding: 0.7rem 0.9rem;
        font-size: 1rem;
        border-radius: 8px;
        border: 1px solid #d0d0d0;
        box-sizing: border-box;
      }
      button {
        background: #111;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 1rem;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .inline { display: flex; gap: 0.5rem; }
      .inline button { margin-top: 0; }
      pre {
        background: #f5f5f5;
        padding: 0.8rem;
        border-radius: 6px;
        font-size: 0.85rem;
        overflow: auto;
      }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .row input[type='checkbox'] { width: auto; }
    </style>
  </head>
  <body>
    <h1>QuickAuth — phone OTP demo</h1>

    <div class="row">
      <input id="consent" type="checkbox" />
      <label for="consent" style="margin: 0">
        I agree to QuickAuth using device + attribution data (DPDP / GDPR)
      </label>
    </div>

    <div class="row">
      <input id="autosubmit" type="checkbox" />
      <label for="autosubmit" style="margin: 0">
        Verify automatically when the code is read from the SMS
      </label>
    </div>

    <label for="phone">Phone (E.164)</label>
    <input id="phone" type="tel" placeholder="+919876543210" />
    <button id="send">Send OTP</button>

    <label for="code">OTP code</label>
    <input
      id="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      placeholder="123456"
    />
    <div class="inline">
      <button id="verify" disabled>Verify</button>
      <button id="resend" disabled>Resend</button>
    </div>

    <h2 style="margin-top: 2rem">Result</h2>
    <pre id="out">awaiting input</pre>

    <!--
      The IIFE bundle exposes the SDK flat on `window`: QuickAuth.init(...),
      NOT QuickAuth.QuickAuth.init(...) — the 1.1.0 build was double-nested.
      Replace the relative src with a CDN URL once the package is published.
    -->
    <script src="../dist/index.global.js"></script>
    <script>
      const $ = (id) => document.getElementById(id)
      const out = $('out')
      const log = (msg) => {
        out.textContent =
          typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2)
      }

      QuickAuth.init({
        apiBaseUrl: 'https://api.quickauth.in',
        // Customer's backend exposes /api/quickauth-token, which calls
        // POST https://api.quickauth.in/v1/sdk/session with X-Client-Id +
        // X-Client-Secret and returns { sessionToken, expiresIn }.
        onTokenExpiry: async () =>
          (await fetch('/api/quickauth-token').then((r) => r.json()))
            .sessionToken,

        // ONE handler for the whole lifecycle. Every outcome arrives here —
        // the methods below return promises, but the events are what you
        // render from.
        onAuthEvent: (event) => {
          switch (event.type) {
            case 'OTP_SENT':
              $('verify').disabled = false
              $('resend').disabled = false
              log({ stage: 'sent', ...event })
              break

            case 'OTP_AUTO_READ':
              // The SDK armed WebOTP inside initiate() — no observeOTP call
              // is needed to get here.
              $('code').value = event.code
              $('verify').disabled = false
              log({ stage: 'auto-read', code: event.code })
              break

            case 'VERIFIED':
              $('verify').disabled = true
              $('resend').disabled = true
              log({ stage: 'verified', requestId: event.requestId })
              // Hand requestId to your backend, which confirms it
              // server-to-server and mints your own session.
              QuickAuth.attribution.trackConversion({
                event: 'login',
                currency: 'INR',
              })
              break

            case 'OTP_FAILED':
              // Retry-able: the SDK stays ready for another submitOtp().
              log({ stage: 'wrong code', message: event.message })
              break

            case 'ERROR':
              log({ stage: 'error', code: event.code, message: event.message })
              break
          }
        },
      })

      $('consent').addEventListener('change', (e) => {
        QuickAuth.consent.set(e.target.checked)
      })

      // Capture WhatsApp template attribution on page load.
      QuickAuth.attribution.captureLaunch().then((r) => {
        if (r.matched) console.log('[QuickAuth] matched campaign', r)
      })

      // Optional. Auto-read already works through OTP_AUTO_READ above; this
      // only stamps autocomplete="one-time-code" on the input for iOS
      // QuickType, and shares the SDK's single WebOTP request.
      QuickAuth.auth.observeOTP({ input: '#code', onCode: () => {} })

      $('send').addEventListener('click', async () => {
        try {
          await QuickAuth.auth.initiate({
            phone: $('phone').value.trim(),
            channel: 'auto',
            autoSubmit: $('autosubmit').checked,
          })
        } catch (err) {
          log('Error: ' + (err && err.message ? err.message : err))
        }
      })

      $('verify').addEventListener('click', async () => {
        try {
          await QuickAuth.auth.submitOtp($('code').value.trim())
        } catch (err) {
          log('Error: ' + (err && err.message ? err.message : err))
        }
      })

      // No phone number: resendOtp() replays the number, channel and
      // autoSubmit setting the current attempt already has.
      $('resend').addEventListener('click', async () => {
        try {
          await QuickAuth.auth.resendOtp()
        } catch (err) {
          log('Error: ' + (err && err.message ? err.message : err))
        }
      })
    </script>
  </body>
</html>
